apis:
- name: Kargo Public GraphQL API
  description: >-
    Kargo's original public integration method, maintained for existing integrations and still the surface
    behind the Unified Endpoint API. Exposes queries for businesses, shipments, push messages and the
    Kargo agent download, mutations for creating and updating shipments, orders, order items, SKUs, exceptions
    and parsed images, and a pushMessage subscription as an alternative to webhooks. Anonymous introspection
    is open.

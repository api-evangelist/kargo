also_derived_from: graphql/kargo-public-graphql.graphql
summary: 'Kargo''s domain is a four-level physical hierarchy — Business owns Facilities,
  a Facility has Docks, a Shipment arrives at a Dock carrying Orders, an Order carries
  Order Items, and every Order Item is a physical unit (a pallet or case) identified by
  an LPN that the vision system reads off a label. The SKU Master is a separate
  reference table keyed on business + facility + sku_id. The imaging side (Pallet, Label,
  PalletImage, ShippingItemImage/Video, TaggedImage) hangs off the shipping items and is
  exposed only on the GraphQL surface.'
entities:
- name: Business
  key: slug
  surface: graphql
  description: 'A unique Kargo customer, created during configuration. 1:many with Facility.'
- name: Facility
  key: slug
  surface: graphql
  description: 'A physical site. Carries an Address and a set of Docks.'
- name: Dock
  key: dockId / dockSlug
  surface: graphql, webhook
  description: 'A dock door where a Kargo tower observes pallets.'
- name: Shipment
  key: id
  natural_key: business + facility + shipmentNumber
  surface: rest, graphql, webhook
  status_enum: ShipmentStatus (graphql); `status` on the REST Shipment schema
  description: 'The unit of work. Scheduled from customer data, then validated against
    what the vision system actually observes.'
- name: Order
  key: id
  natural_key: business + facility + direction + orderNumber
  surface: rest, graphql
  description: 'A customer order attached to a shipment. Direction is INBOUND or OUTBOUND.'
- name: OrderItem
  key: id
  natural_key: lpn + sku (within an order)
  surface: rest, graphql
  description: 'A physical unit on an order. Reference resolution order published by
    Kargo: identifier when provided, otherwise lpn, then sku.'
- name: SkuMaster
  key: business + facility + sku_id
  surface: rest
  description: 'Reference data for a SKU: description, units of measure and weight,
    alternate SKU ids, and the pallet geometry (cases_per_pallet, cases_per_layer,
    layers_per_pallet) the vision system uses to reason about a stack.'
- name: Pallet
  key: kargoPalletId
  surface: graphql, webhook
  description: 'An observed physical pallet, with images and read label fields.'
- name: Label
  surface: graphql
  description: 'A label read off a pallet, decomposed into LabelField values with
    image Coordinates.'
- name: PushMessage
  surface: graphql
  description: 'The event record behind both the webhook push API and the pushMessage
    subscription. Typed by PushMessageTypes.'
- name: Exception
  surface: graphql
  description: 'A flagged discrepancy, created via createException; typed by
    ExceptionLevel and ExceptionPriority.'

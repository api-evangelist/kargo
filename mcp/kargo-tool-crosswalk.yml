finding: 'The surface Kargo calls "legacy" is the larger one. The GraphQL API carries
  every read, the entire event/streaming surface, the only SKU delete, and the
  image-parsing capability; the REST API carries three operations, XML support and the
  problem+json envelope. An integrator told to prefer REST because GraphQL is legacy
  cannot read a shipment, cannot list businesses, cannot recover a missed webhook, and
  cannot undo a SKU write.'

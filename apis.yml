aid: kargo
name: Kargo
description: 'Kargo (Kargo Technologies, kargo.ai) builds an AI-powered smart loading
  dock for warehouses and distribution centers. Camera towers (Kargo Tower) and forklift-mounted
  cameras (Kargo Lift) apply computer vision to every pallet that moves through a dock
  door, reading LPN, SKU, lot code and expiration-date labels to automate shipping
  and receiving, verify loads and shipments, detect damage, and feed inventory visibility,
  shelf-life management, FSMA traceability, claims management, financial reconciliation
  and automated ASNs back into the customer WMS. Kargo publishes a public integration
  surface for that data exchange: a REST Document Intake API described by an OpenAPI
  3.1 document, a public GraphQL API with open anonymous introspection, a single unified
  JSON endpoint, a webhook (push) API at shipment and pallet level plus a GraphQL subscription
  alternative, and flat-file ingest over email, SFTP or AS2. All programmatic access is
  Auth0 OAuth 2.0 client-credentials bearer tokens.'

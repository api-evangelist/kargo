      responses:
        '200':
          description: SKU master records were created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkuMasterUpsertResult'
        '400':
          description: Malformed JSON or XML request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Token lacks permission for the given business/facility.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Facility not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type; use application/json, application/xml, or text/xml.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >
            Semantically invalid request, such as missing `business` or
            `facility`, missing `sku_id`, duplicate `sku_id` values in the same
            request, invalid pagination value, or wrong field type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: getSkuMaster
      summary: Retrieve SKU master records
      description: >
        Returns SKU master records for a facility. If `sku_id` is provided, the
        response is filtered to that SKU. If `limit` is provided, pagination is
        enabled and `offset` defaults to 0. When another page is available,
        `next_offset` contains the offset to use for the next request.

        Example request for all SKUs in a facility:

        `GET /v1/sku_master?business=kargo&facility=sf`

        Example request for one SKU:

        `GET /v1/sku_master?business=kargo&facility=sf&sku_id=TEST-SKU-001`

        Example paginated request:

        `GET /v1/sku_master?business=kargo&facility=sf&limit=100&offset=0`
      tags: [SKU Master]
      parameters:
        - name: business
          in: query
          required: true
          description: Business slug that scopes the facility, same as `/v1/documents`.
          schema:
            type: string
          example: kargo
        - name: facility
          in: query
          required: true
          description: Facility slug that scopes the SKU master records, same as `/v1/documents`.
          schema:
            type: string
          example: sf
        - name: sku_id
          in: query
          required: false
          description: Optional SKU id filter. If omitted, all SKUs for the facility are returned.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: >
            Optional page size. When provided, pagination is enabled. The API
            caps this value at 100.
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          description: >
            Number of records to skip when pagination is enabled. Defaults to 0
            when `limit` is provided.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: SKU master records for the requested facility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkuMasterListResult'
              examples:
                fullList:
                  summary: Full SKU master response
                  value:
                    skus:
                      - business: kargo
                        facility: sf
                        sku_id: TEST-SKU-001
                        description: Test SKU 001
                        unit_of_measure: CASE
                        unit_of_weight: LB
                        alternate_sku_ids:
                          - ALT-001
                          - UPC-001
                        cases_per_pallet: 55
                        cases_per_layer: 7
                        layers_per_pallet: 10
                        sku_metadata:
                          source: local-test
                          category: snack
                        created_at: "2026-06-05T12:00:00.000Z"
                        updated_at: "2026-06-05T12:30:00.000Z"
                      - business: kargo
                        facility: sf
                        sku_id: TEST-SKU-002
                        description: Test SKU 002
                        unit_of_measure: EACH
                        unit_of_weight: null
                        alternate_sku_ids: null
                        cases_per_pallet: 43
                        cases_per_layer: 6
                        layers_per_pallet: 8
                        sku_metadata:
                          source: local-test
                        created_at: "2026-06-05T12:05:00.000Z"
                        updated_at: "2026-06-05T12:35:00.000Z"
                    total: 2
                    limit: null
                    offset: null
                    next_offset: null
                paginated:
                  summary: Paginated SKU master response
                  value:
                    skus:
                      - business: kargo
                        facility: sf
                        sku_id: TEST-SKU-001
                        description: Test SKU 001
                        unit_of_measure: CASE
                        unit_of_weight: LB
                        alternate_sku_ids:
                          - ALT-001
                        cases_per_pallet: 55
                        cases_per_layer: 7
                        layers_per_pallet: 10
                        sku_metadata:
                          source: local-test
                        created_at: "2026-06-05T12:00:00.000Z"
                        updated_at: "2026-06-05T12:30:00.000Z"
                    total: 25
                    limit: 1
                    offset: 0
                    next_offset: 1
        '401':
          description: Missing or invalid bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Token lacks permission for the given business/facility.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Facility not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid query parameter, such as missing `business` or `facility`, or invalid `limit` / `offset`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SkuMasterUpsertRequest:
      type: object
      additionalProperties: false
      required: [business, facility, skus]
      properties:
        business:
          type: string
          description: Business slug that scopes the facility, same as `/v1/documents`.
        facility:
          type: string
          description: Facility slug that scopes the SKU master upsert, same as `/v1/documents`.
        skus:
          type: array
          description: >
            List of SKU master records to create or update. This field is
            list-only; send a one-item array to update a single SKU.
          items:
            $ref: '#/components/schemas/SkuMasterInput'
    SkuMasterInput:
      type: object
      additionalProperties: false
      required: [sku_id]
      description: >
        Editable SKU master fields. `sku_id` is required and is used as the
        upsert key within the provided facility. All other fields are optional;
        when updating an existing SKU, omitted fields are left unchanged.
      properties:
        sku_id:
          type: string
          description: Unique SKU identifier within the facility.
        description:
          type: [string, 'null']
          description: Human-readable description of the SKU.
        unit_of_measure:
          type: [string, 'null']
          description: Unit used to measure SKU quantity, such as CASE, EACH, or PALLET.
        unit_of_weight:
          type: [string, 'null']
          description: Unit used to measure SKU weight, such as LB or KG.
        alternate_sku_ids:
          type: [array, 'null']
          description: Alternate SKU identifiers or barcodes associated with this SKU.
          items:
            type: string
        cases_per_pallet:
          type: [integer, 'null']
          description: Number of cases that fit on one pallet for this SKU.
        cases_per_layer:
          type: [integer, 'null']
          description: Number of cases in one pallet layer for this SKU.
        layers_per_pallet:
          type: [integer, 'null']
          description: Number of layers per pallet for this SKU.
        sku_metadata:
          description: Additional SKU metadata stored as JSON.
    SkuMaster:
      type: object
      description: SKU master record from the `sku_master` database table.
      properties:
        business:
          type: string
          description: Business slug associated with the SKU master record.
        facility:
          type: string
          description: Facility slug associated with the SKU master record.
        sku_id:
          type: string
          description: Unique SKU identifier within the facility.
        description:
          type: [string, 'null']
          description: Human-readable description of the SKU.
        unit_of_measure:
          type: [string, 'null']
          description: Unit used to measure SKU quantity, such as CASE, EACH, or PALLET.
        unit_of_weight:
          type: [string, 'null']
          description: Unit used to measure SKU weight, such as LB or KG.
        alternate_sku_ids:
          type: [array, 'null']
          description: Alternate SKU identifiers or barcodes associated with this SKU.
          items:
            type: string
        cases_per_pallet:
          type: [integer, 'null']
          description: Number of cases that fit on one pallet for this SKU.
        cases_per_layer:
          type: [integer, 'null']
          description: Number of cases in one pallet layer for this SKU.
        layers_per_pallet:
          type: [integer, 'null']
          description: Number of layers per pallet for this SKU.
        sku_metadata:
          description: Additional SKU metadata stored as JSON.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the SKU master record was created.
        updated_at:
          type: [string, 'null']
          format: date-time
          description: Timestamp when the SKU master record was last updated.
    SkuMasterUpsertResult:
      type: object
      required: [numRecordsAdded, numRecordsUpdated, skus]
      properties:
        numRecordsAdded:
          type: integer
          description: Number of SKU master records created by the request.
        numRecordsUpdated:
          type: integer
          description: Number of existing SKU master records updated by the request.
        skus:
          type: array
          description: SKU master records after the upsert operation.
          items:
            $ref: '#/components/schemas/SkuMaster'
    SkuMasterListResult:
      type: object
      required: [skus, total, limit, offset, next_offset]
      properties:
        skus:
          type: array
          description: SKU master records matching the request.
          items:
            $ref: '#/components/schemas/SkuMaster'
        total:
          type: integer
          description: Total number of SKU master records matching the filter before pagination.
        limit:
          type: [integer, 'null']
          description: Page size used for this request. Null when pagination is not enabled.
        offset:
          type: [integer, 'null']
          description: Offset used for this request. Null when pagination is not enabled.
        next_offset:
          type: [integer, 'null']
          description: Offset to use for the next page. Null when there is no next page or pagination is not enabled.
    Document:
      type: object
      additionalProperties: false
      required: [business, facility, direction]
      oneOf:
        - required: [orderNumber]
          not:
            required: [orders]
        - required: [orders, shipmentNumber]
          not:
            required: [orderNumber]
      description: >
        Flattened shipment + order + order-item document. This schema supports two formats:
        the existing single order format with top level `orderNumber`, and a
        shipment level multi order format with `orders`.
        In single order mode, `orderNumber` is required at the top level. In
        multi order mode, `shipmentNumber` and `orders` are required and each 
        order entry must include `orderNumber`.

        `business`, `facility`, and `direction` are required. 
        Item field requirements depend on `orderItemUpdateStrategy`: `APPEND` and `OVERWRITE`
        require each item to include `lpn`, `sku`, `quantity`, and `quantityUnit`;
        `MERGE` and `DELETE` require each item to include `lpn` and `sku`. If
        `orderItemUpdateStrategy` is omitted and `items` are provided, Kargo treats
        the request as `OVERWRITE`.
      properties:
        orderNumber:
          type: string
          description: >
            Single order mode upsert key. If an order with this number exists,
            the document is applied to the most recently created matching order;
            otherwise a new order and shipment are created. Do not include this
            field when using `orders`.
        business:
          type: string
          description: Short name / slug of the business, e.g. "kargo".
        facility:
          type: string
          description: Short name / slug of the facility, e.g. "sf".
        direction:
          $ref: '#/components/schemas/OrderDirection'
          description: Canonical direction of the order.
        shipmentNumber:
          type: string
          description: >
            Facility provided unique shipment identifier. 
        expectedArrivalAt:
          type: string
          format: date-time
        trailerNumber:
          type: string
        dockSlug:
          type: string
          description: Short name of the dock, e.g. "D11".
        driverName:
          type: string
        driverLicenseNumber:
          type: string
        driverLicensePlate:
          type: string
        additionalFields:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentAdditionalField'
        orderType:
          type: string
        purchaseOrder:
          type: string
        consigneeName:
          type: string
        consigneePhoneNumber:
          type: string
        bolNumber:
          type: string
        expectedQuantity:
          type: integer
        carrier:
          type: string
        sealNumber:
          type: string
        supplier:
          type: string
        client:
          type: string
        destination:
          type: string
        orderItemUpdateStrategy:
          allOf:
            - $ref: '#/components/schemas/OrderItemUpdateStrategy'
          default: OVERWRITE
          description: >
            Shipment level default item update strategy. In multi order mode,
            this value applies to each order unless that order provides its own
            `orderItemUpdateStrategy`.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
        orders:
          type: array
          minItems: 1
          description: >
            Multi order mode list. Each entry is processed as one order on the
            same shipment. Do not include top level `orderNumber` when using this
            field.
          items:
            $ref: '#/components/schemas/BatchOrderInput'
      allOf:
        # No strategy + items means the default strategy is OVERWRITE, so each
        # incoming item must include the full item fields needed to recreate it.
        - if:
            required: [items]
            not:
              required: [orderItemUpdateStrategy]
          then:
            properties:
              items:
                items:
                  required: [lpn, sku, quantity, quantityUnit]
        # APPEND and OVERWRITE both create incoming items, so each item must
        # include the fields required to persist a complete order item.
        - if:
            required: [orderItemUpdateStrategy]
            properties:
              orderItemUpdateStrategy:
                enum: [APPEND, OVERWRITE]
          then:
            properties:
              items:
                items:
                  required: [lpn, sku, quantity, quantityUnit]
        # MERGE and DELETE identify existing order items by LPN + SKU. Quantity
        # fields are optional because they are not needed to identify the item.
        - if:
            required: [orderItemUpdateStrategy]
            properties:
              orderItemUpdateStrategy:
                enum: [MERGE, DELETE]
          then:
            properties:
              items:
                items:
                  required: [lpn, sku]
    BatchOrderInput:
      type: object
      additionalProperties: false
      required: [orderNumber]
      description: >
        One order inside a shipment level multi order document. `orderNumber`
        identifies the order. Each order can provide its own
        `orderItemUpdateStrategy`, so different orders in the same shipment can
        use different strategies. If `orderItemUpdateStrategy` is omitted for
        this order, the top level `orderItemUpdateStrategy` is used. If neither
        value is provided, Kargo treats the order item update strategy as
        `OVERWRITE`.
      properties:
        orderNumber:
          type: string
          description: >
            Upsert key for this order. This is the Kargo order identifier.
        orderType:
          type: string
        purchaseOrder:
          type: string
        consigneeName:
          type: string
        consigneePhoneNumber:
          type: string
        bolNumber:
          type: string
        expectedQuantity:
          type: integer
        sealNumber:
          type: string
        supplier:
          type: string
        client:
          type: string
        destination:
          type: string
        orderItemUpdateStrategy:
          allOf:
            - $ref: '#/components/schemas/OrderItemUpdateStrategy'
          description: >
            Optional order level item update strategy. When provided, this
            overrides the top level `orderItemUpdateStrategy` for this order.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
      allOf:
        - if:
            required: [orderItemUpdateStrategy]
            properties:
              orderItemUpdateStrategy:
                enum: [APPEND, OVERWRITE]
          then:
            properties:
              items:
                items:
                  required: [lpn, sku, quantity, quantityUnit]
        - if:
            required: [orderItemUpdateStrategy]
            properties:
              orderItemUpdateStrategy:
                enum: [MERGE, DELETE]
          then:
            properties:
              items:
                items:
                  required: [lpn, sku]
    OrderItemInput:
      type: object
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: >
            Customer supplied identifier for the item. Optional. This field is not used
            to match items for `MERGE` or `DELETE`; item matching uses `lpn` + `sku`.
        lpn:
          type: string
          description: License plate number. Used together with `sku` as the item key for MERGE and DELETE.
        sku:
          type: string
          description: SKU. Used together with `lpn` as the item key for MERGE and DELETE.
        quantity:
          type: integer
        quantityUnit:
          type: string
          description: ShipperUnitType enum.
        purchaseOrder:
          type: string
        description:
          type: string
        upc:
          type: string
        weightPerUnit:
          type: number
        weightUnit:
          type: string
          description: WeightUnit enum.
        height:
          type: number
        length:
          type: number
        dimensionUnit:
          type: string
          description: DimensionUnit enum.
        isDangerousGood:
          type: boolean
        lot:
          type: string
        expirationDate:
          type: string
          format: date
        manufacturingDate:
          type: string
          format: date
        caseSerials:
          type: array
          description: >
            Case-level serials for this order item. Clients provide only `id`
            and `quantity`; Kargo stores these as order_item.sub_units with
            unit_type set to "case".
          items:
            $ref: '#/components/schemas/CaseSerial'
    CaseSerial:
      type: object
      additionalProperties: false
      required: [id, quantity]
      properties:
        id:
          type: string
          description: Case serial identifier.
        quantity:
          type: integer
          description: Quantity represented by this case serial.
    ShipmentAdditionalField:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    DocumentResult:
      type: object
      required: [created, updated, removed]
      properties:
        shipment:
          $ref: '#/components/schemas/Shipment'
        created:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
        updated:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
        removed:
          type: array
          description: >
            Entities removed by reconciliation, e.g. order items dropped when
            orderItemUpdateStrategy is `OVERWRITE`.
          items:
            $ref: '#/components/schemas/EntityRef'
    EntityRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [SHIPMENT, ORDER, ORDER_ITEM]
        id:
          type: string
          description: >
            Kargo identifier of the affected entity: shipment id, order
            externalId, or order item id.
        reference:
          type: string
          description: >
            Human-facing key where one exists, such as `shipmentNumber` for a shipment,
            `orderNumber` for an order, or `lpn` + `sku` information for an order item.
    Shipment:
      type: object
      description: The resulting shipment after the document is processed.
      properties:
        id:
          type: integer
        status:
          type: string
        expectedArrivalAt:
          type: string
          format: date-time
        carrier:
          type: string
        purchaseOrder:
          type: string
        facility:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
        statusEvents:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              displayName:
                type: string
              completed:
                type: boolean
              completedAt:
                type: string
                format: date-time
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    Order:
      type: object
      properties:
        externalId:
          type: string
        orderNumber:
          type: string
        status:
          type: string
          enum: [CREATED, SCHEDULED, COMPLETED]
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/OrderItemInput'
              - type: object
                properties:
                  id:
                    type: string
    Problem:
      type: object
      description: RFC 9457 problem detail.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              detail:
                type: string
    OrderDirection:
      type: string
      enum: [OUTBOUND, INBOUND]
    OrderItemUpdateStrategy:
      type: string
      description: |
        How the incoming `items` reconcile with items already on the matched order:
        If omitted and `items` are provided, defaults to `OVERWRITE`. If no
        `items` are provided, existing order items are unchanged.

          - `APPEND`    — add incoming items to the order and keep existing items. Each incoming item requires `lpn`, `sku`, `quantity`, and `quantityUnit`. Duplicate `lpn` + `sku` pairs are rejected with `409 Conflict`; use `MERGE` to update existing items or `OVERWRITE` to replace the full item list.
          - `OVERWRITE` — replace all existing order items with the incoming items. If multiple orders have the same order number, the most recently created order is updated. Each incoming item requires `lpn`, `sku`, `quantity`, and `quantityUnit`.
          - `MERGE`     — update existing items matched by `lpn` + `sku`; non-matching incoming items are added. Each incoming item requires `lpn` and `sku`.
          - `DELETE`    — remove existing order items matched by `lpn` + `sku`. Each incoming item requires `lpn` and `sku`.
      enum: [APPEND, OVERWRITE, MERGE, DELETE]
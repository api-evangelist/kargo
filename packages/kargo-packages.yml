packages: []
note: 'Kargo publishes NO first-party client libraries in any package registry. Its own
  documentation offers no SDK section and its integration examples are raw curl and raw
  Python HTTP requests, with the explicit statement that "an integration can be built in
  any language or framework that can make HTTP requests and receive webhooks". Kargo''s
  GitHub organization (github.com/mykargo) holds three public repositories — speed-check
  (HTML), docs (an unmodified Mintlify starter template) and jetson_memtest (C++) — and
  none is a client library. What Kargo does distribute instead is the "Kargo agent", a
  binary that runs inside the customer network; it is fetched through the GraphQL
  kargoAgent query, which returns a single-use token redeemed at
  api.kargo.zone/download_agent_with_token, valid for 5 minutes. That is a gated,
  non-registry distribution with no version metadata a consumer can read.'

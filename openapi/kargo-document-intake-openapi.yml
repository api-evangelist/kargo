                    <shipmentNumber>TEST-EXAMPLE-SHIPMENT-001</shipmentNumber>
                    <orderItemUpdateStrategy>APPEND</orderItemUpdateStrategy>
                    <items>
                      <lpn>LPNNEW</lpn>
                      <sku>SKUAPPEND</sku>
                      <quantity>1</quantity>
                      <quantityUnit>UNIT</quantityUnit>
                    </items>
                  </Document>
              mergeOrderItemByLpnAndSku:
